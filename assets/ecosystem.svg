<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%">
  <rect width="100%" height="100%" fill="#0d1117" rx="16"/>

  <defs>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#fbbf24" flood-opacity="0.35"/>
    </filter>

    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .repo-name { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #ffffff; letter-spacing: 0.5px; dominant-baseline: middle; text-anchor: middle; }
    .role-purple { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #c4b5fd; dominant-baseline: middle; text-anchor: middle; }
    .role-blue { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #93c5fd; dominant-baseline: middle; text-anchor: middle; }
    .role-orange { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #fcd34d; dominant-baseline: middle; text-anchor: middle; }
    .role-gold { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #fde68a; dominant-baseline: middle; text-anchor: middle; }
    .desc { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #94a3b8; dominant-baseline: middle; text-anchor: middle; }
    
    .label-text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 13px; fill: #e2e8f0; font-weight: 600; dominant-baseline: middle; text-anchor: middle; }
    .label-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5px; rx: 14px; }
  </style>

  <path d="M 320 200 L 460 200" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  
  <path d="M 740 170 Q 815 60 885 160" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  
  <path d="M 890 230 Q 815 340 745 240" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  
  <path d="M 1020 260 L 1020 390 L 190 390 L 190 275" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8,6" marker-end="url(#arrowGray)"/>

  <rect x="315" y="188" width="160" height="24" class="label-bg"/>
  <text x="395" y="200" class="label-text">1. 賦予邏輯推理與算力</text>

  <rect x="730" y="93" width="170" height="24" class="label-bg"/>
  <text x="815" y="105" class="label-text">2. 專案開發累積的技術債</text>

  <rect x="725" y="283" width="180" height="24" class="label-bg"/>
  <text x="815" y="295" class="label-text">3. 產出修復路線圖交由代理執行</text>

  <rect x="520" y="378" width="160" height="24" class="label-bg"/>
  <text x="600" y="390" class="label-text">調用大腦進行靜態分析</text>

  <g transform="translate(60, 140)" filter="url(#glowPurple)">
    <rect width="260" height="120" rx="12" fill="#0f172a" stroke="url(#gradPurple)" stroke-width="2.5"/>
    <text x="130" y="35" class="role-purple">🧠 Tier 1 : 核心大腦</text>
    <text x="130" y="65" class="repo-name">Local-Agent-Workspace</text>
    <text x="130" y="95" class="desc">極致優化的本地 LLM 算力引擎</text>
  </g>

  <g transform="translate(480, 140)" filter="url(#glowBlue)">
    <rect width="260" height="120" rx="12" fill="#0f172a" stroke="url(#gradBlue)" stroke-width="2.5"/>
    <text x="130" y="35" class="role-blue">🤖 Tier 2 : 代理工程師</text>
    <text x="130" y="65" class="repo-name">CK's Pi Harness</text>
    <text x="130" y="95" class="desc">注入工程紀律的自動化編程樞紐</text>
  </g>

  <g transform="translate(900, 140)" filter="url(#glowOrange)">
    <rect width="260" height="120" rx="12" fill="#0f172a" stroke="url(#gradOrange)" stroke-width="2.5"/>
    <text x="130" y="35" class="role-orange">👁️ Tier 3 : 全域修復雷達</text>
    <text x="130" y="65" class="repo-name">OmniHeal</text>
    <text x="130" y="95" class="desc">零安裝的全局技術債掃描工具</text>
  </g>


  <line x1="80" y1="416" x2="1120" y2="416" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="600" y="406" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" font-weight="500" text-anchor="middle">── 平行延伸工具，獨立運作，不介入開發流程 ──</text>

  <g transform="translate(470, 432)" filter="url(#glowGold)">
    <rect width="260" height="120" rx="12" fill="#0f172a" stroke="url(#gradGold)" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="130" y="35" class="role-gold">📝 延伸工具 : 知識資產提煉</text>
    <text x="130" y="65" class="repo-name">InfoGold</text>
    <text x="130" y="95" class="desc">原始文本 → 黃金知識資產套件</text>
  </g>

</svg>
